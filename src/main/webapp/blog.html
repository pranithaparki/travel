<!DOCTYPE html>
<html>
    <head>
        <style>
            .video-section {
                padding: 3rem 2rem;
                text-align: center;
                background-color: #f0f8ff;
              }
              
              .video-wrapper {
                position: relative;
                padding-bottom: 56.25%; /* 16:9 aspect ratio */
                height: 0;
                overflow: hidden;
                max-width: 100%;
              }
              
              .video-wrapper iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border-radius: 12px;
              }
        </style>
    </head>
  </div>
  <body><div class="video-section">
    <h2>Watch Our Travel Promo</h2>
    <div class="video-wrapper">
      <iframe 
        width="560" 
        height="315" 
        src="https://www.youtube.com/embed/xw5jHlbAEzE" 
        title="YouTube video player" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
      
    </div>
  </div>
<script>
  function showVideo() {
    document.getElementById('videoContainer').style.display = 'block';
  }
</script>
</body>
</html>
