<!DOCTYPE html>
<html lang="en">
<head>
<title>South India Destinations</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #f9f9f9;
  }
  
  header {
    background-color: #0a3d62;
    color: white;
    padding: 20px;
    text-align: center;
  }
  
  nav a {
    margin: 0 15px;
    color: #fff;
    text-decoration: none;
    font-weight: bold;
  }
  
  .state-section {
    padding: 40px 20px;
    background-color: bisque;
  }
  .state-section button{
   background-color: palevioletred;
  }
  
  .card-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    background-color: bisque;
  }
  
  .place-card {
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    width: 250px;
    overflow: hidden;
    text-align: center;
  }
  
  .place-card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
  }
  
  footer {
    background: #333;
    color: white;
    text-align: center;
    padding: 15px;
  }
</style>
</head>
<body>
  <header>
    <h1>Explore South India</h1>
    <nav>
      <a href="#kerala">Kerala</a>
      <a href="#karnataka">Karnataka</a>
      <a href="#tamilnadu">Tamil Nadu</a>
    </nav>
  </header>

  <main>
    
    <section id="kerala" class="state-section">
        
        <center>
      <h2>Kerala</h2>
    </center>
      <div class="card-container">
        <div class="place-card">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSAoiSP_XyWCjOtX6gHE7xg1P-Dt07SCRvjSA&s" alt="Padmanabhaswamy Temple">
          <h3>Padmanabhaswamy Temple</h3>
                
        </div>
        <div class="place-card">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTQH9TKoJNCMCOpvcpGT9MmgqsprV8Q41SJkg&s" alt="Munnar">
          <h3>Munnar</h3>
          
        </div>
        <div class="place-card">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrpYtvoRnA6AguEW_9PtbDwipzilyFEoVw-Q&s" alt="wayanad">
          <h3>Wayanad</h3>
          
        </div>
        
      </div>
    </section>

    
    <section id="karnataka" class="state-section">
      <center>
        <h2>Karnataka</h2>
    </center>
      <div class="card-container">
        <div class="place-card">
          <img src="https://vl-prod-static.b-cdn.net/system/images/000/711/619/f5fd357355dd3de37d14f13992e43732/original/BmAPFEzHIc1.jpg?1710292784" alt="Murudeshwar">
          <h3>Murudeshwar Temple</h3>
          
        </div>
        <div class="place-card">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRthD4yiCbHDzhux2z8gcbIe7Efgz-XDt2OrA&s" alt="Abbey Falls">
          <h3>Abbey Falls</h3>
          
        </div>
        <div class="place-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLE1ZZF_hAeI2VI-N9nPqNe8eUgt_DURdJUQ&s" alt="chikmagulur">
            <h3>chikmagulur</h3>
             
        </div>
        
       
      </div>
    </section>

   
    <section id="tamilnadu" class="state-section">
        <center>
      <h2>Tamil Nadu</h2>
    </center>
      <div class="card-container">
        <div class="place-card">
          <img src="https://m.media-amazon.com/images/I/81wAACsKd-L.AC_UF1000,1000_QL80.jpg" alt="Meenakshi Temple">
          <h3>Madurai / Rameshwaram</h3>
         
        </div>
        <div class="place-card">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQjyqYJnFjrL5g-aZUkn-7OwEXbDvau3cGmGg&s" alt="Kodaikanal">
          <h3>Kodaikanal</h3>
          
        </div>
        <div class="place-card">
            <img src="https://hikerwolf.com/wp-content/uploads/2020/06/Ooty.jpg" alt="ooty">
            <h3>Ooty</h3>
            
            
          </div>
        
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Travel South India. All rights reserved.</p>
  </footer>

  <script>
    console.log("Welcome to South India Tour Packages!");</script>
</body>
</html>
